name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: ts-version
      - run: bun run lint
        working-directory: ts-version
      - run: bun run test
        working-directory: ts-version
